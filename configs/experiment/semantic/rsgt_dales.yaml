# @package _global_
# python src/train.py experiment=semantic/rsgt_dales

defaults:
  - override /datamodule: semantic/dales.yaml
  - override /model: semantic/rsgt.yaml
  - override /trainer: gpu.yaml

trainer:
  max_epochs: 400

datamodule:
  dataloader:
    batch_size: 4

model:
  optimizer:
    lr: 0.01
    weight_decay: 1e-4
